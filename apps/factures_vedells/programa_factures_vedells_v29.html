<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factures Vedells</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ec;--card:#fff;--ink:#1c1b18;--muted:#8a8478;--border:#e2ddd5;
  --fig:#4a7c59;--fig-lt:#eaf3ed;
  --costa:#3d6b8c;--costa-lt:#e4eff7;
  --eco:#4a7c59;--eco-lt:#eaf3ed;
  --pe:#b5560e;--pe-lt:#fdf0e7;
  --sat:#7b5ea7;--sat-lt:#f0ebf8;
  --ram:#3d6b8c;--ram-lt:#e4eff7;
  --shadow:0 2px 14px rgba(0,0,0,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--ink);min-height:100vh}

header{background:var(--ink);color:#fff;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
header h1{font-family:'Playfair Display',serif;font-size:1.1rem}
header .sub{font-family:'DM Mono',monospace;font-size:.7rem;color:#999}

.tabs{display:flex;background:var(--ink);padding:0 20px;gap:3px}
.tab{padding:9px 18px;font-size:.83rem;font-weight:500;cursor:pointer;border-radius:8px 8px 0 0;border:none;background:none;color:#888;font-family:'DM Sans',sans-serif;transition:all .2s}
.tab.active{background:var(--bg);color:var(--ink)}

.page{display:none;padding:16px 20px;max-width:820px;margin:0 auto}
.page.active{display:block}

.g-header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.g-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.g-header h2{font-family:'Playfair Display',serif;font-size:1.25rem}
.g-header .gsub{font-size:.73rem;color:var(--muted);font-family:'DM Mono',monospace}

.mes-bar{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);margin-bottom:16px;flex-wrap:wrap}
.mes-bar label{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mes-bar select{padding:6px 9px;border-radius:6px;border:1.5px solid var(--border);font-size:.84rem;background:#fff;font-family:'DM Sans',sans-serif;color:var(--ink)}
.preu-pill{margin-left:auto;background:var(--ink);color:#fff;padding:4px 12px;border-radius:20px;font-family:'DM Mono',monospace;font-size:.73rem;cursor:pointer;border:none}
.preu-pill:hover{background:#333}

.stitle{font-size:.67rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 9px}

/* LOTS */
.lots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px;margin-bottom:8px}
.lot-card{background:var(--card);border-radius:10px;padding:13px 13px 11px;box-shadow:var(--shadow);border-left:4px solid var(--border);position:relative}
.lc-num{font-family:'DM Mono',monospace;font-size:.67rem;color:var(--muted)}
.lc-count{font-family:'Playfair Display',serif;font-size:1.9rem;line-height:1.1;margin:3px 0 1px}
.lc-label{font-size:.67rem;color:var(--muted)}
.lc-carts{margin-top:7px;display:flex;flex-wrap:wrap;gap:3px}
.cc{padding:2px 6px;border-radius:8px;font-size:.65rem;font-weight:700}
.cc-eco{background:var(--eco-lt);color:var(--eco)}
.cc-pe{background:var(--pe-lt);color:var(--pe)}
.cc-sat{background:var(--sat-lt);color:var(--sat)}
.cc-ram{background:var(--ram-lt);color:var(--ram)}
.lot-card .xbtn{position:absolute;top:7px;right:7px;width:18px;height:18px;background:none;border:1px solid var(--border);border-radius:50%;cursor:pointer;font-size:.58rem;color:var(--muted);display:flex;align-items:center;justify-content:center}
.lot-card .xbtn:hover{background:#fee;color:#c44;border-color:#f99}
.bl-eco{border-left-color:var(--eco)}
.bl-pe{border-left-color:var(--pe)}
.bl-sat{border-left-color:var(--sat)}
.bl-ram{border-left-color:var(--ram)}

.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:8px;font-size:.82rem;font-weight:500;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;transition:all .15s}
.b-ink{background:var(--ink);color:#fff}.b-ink:hover{background:#333}
.b-fig{background:var(--fig);color:#fff}.b-fig:hover{background:#3a6347}
.b-costa{background:var(--costa);color:#fff}.b-costa:hover{background:#2f5470}
.b-out{background:#fff;color:var(--ink);border:1.5px solid var(--border)}.b-out:hover{border-color:var(--ink)}
.b-sm{padding:5px 10px;font-size:.76rem}
.btn-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}

/* FORM MOVIMENTS */
.mov-box{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:15px;margin-top:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:9px;margin-bottom:10px}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:.67rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fg input,.fg select{padding:7px 9px;border-radius:7px;border:1.5px solid var(--border);font-size:.84rem;background:#fff;font-family:'DM Sans',sans-serif;color:var(--ink)}
.fg input:focus,.fg select:focus{outline:none;border-color:var(--ink)}

/* MOV LIST */
.mov-list{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.mov-item{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px;background:var(--bg);font-size:.82rem;border:1px solid var(--border)}
.md{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);min-width:22px;font-weight:500}
.mb{padding:2px 7px;border-radius:12px;font-size:.67rem;font-weight:700;white-space:nowrap}
.mb-in{background:#d4f0dc;color:#145a2e}
.mb-out{background:#fde8d8;color:#7a2d0a}
.mq{font-weight:700}
.ml{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted)}
.mc{margin-left:auto}
.mdel{background:none;border:none;cursor:pointer;color:#ccc;font-size:.73rem;padding:2px 5px;border-radius:4px;margin-left:2px}
.mdel:hover{color:#c44;background:#fee}
.empty{text-align:center;padding:22px;color:var(--muted);font-size:.82rem}

/* FACTURA */
.fra-card{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:17px;margin-bottom:11px;border-top:4px solid var(--border)}
.fra-eco{border-top-color:var(--eco)}
.fra-pe{border-top-color:var(--pe)}
.fra-sat{border-top-color:var(--sat)}
.fra-ram{border-top-color:var(--ram)}
.fra-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:13px;flex-wrap:wrap;gap:6px}
.fra-head h3{font-family:'Playfair Display',serif;font-size:.98rem}
.fra-meta{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted)}
.ftable{width:100%;border-collapse:collapse;font-size:.82rem}
.ftable th{text-align:left;padding:5px 7px;font-size:.63rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--border)}
.ftable td{padding:6px 7px;border-bottom:1px solid #f5f2ed}
.ftable th.r,.ftable td.r{text-align:right}
.ftable .fbase td,.ftable .fiva td{color:var(--muted);font-size:.77rem;border-bottom:none;padding-top:8px}
.ftable .ftot td{font-weight:700;font-size:.93rem;border-top:2px solid var(--border);padding-top:9px;border-bottom:none}
.lchip{display:inline-block;padding:1px 6px;border-radius:8px;font-size:.67rem;font-weight:700}

/* MODAL */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:300;align-items:center;justify-content:center;padding:20px}
.mbg.open{display:flex}
.mbox{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.22)}
.mbox h3{font-family:'Playfair Display',serif;font-size:1rem;margin-bottom:14px}
.mact{display:flex;gap:7px;justify-content:flex-end;margin-top:15px}

@media(max-width:560px){
  .lots-grid{grid-template-columns:repeat(2,1fr)}
  .fgrid{grid-template-columns:repeat(2,1fr)}
  .page{padding:12px 13px}
}
</style>
</head>
<body>

<header>
  <div><h1>🐄 Factures Vedells</h1></div>
  <div class="sub" id="avui"></div>
</header>

<div class="tabs">
  <button class="tab active" onclick="showPage('fig',this)">🌿 Figuera</button>
  <button class="tab" onclick="showPage('costa',this)">🏔 La Costa</button>
</div>

<!-- FIGUERA -->
<div class="page active" id="page-fig">
  <div class="g-header">
    <div class="g-dot" style="background:var(--fig)"></div>
    <div><h2>Granja Figuera</h2><div class="gsub">Sant Mateu de Bages</div></div>
  </div>
  <div class="mes-bar">
    <label>Mes</label>
    <select id="fig-mes" onchange="renderG('fig')">
      <option value="1">Gen</option><option value="2">Feb</option><option value="3" selected>Mar</option>
      <option value="4">Abr</option><option value="5">Mai</option><option value="6">Jun</option>
      <option value="7">Jul</option><option value="8">Ago</option><option value="9">Set</option>
      <option value="10">Oct</option><option value="11">Nov</option><option value="12">Des</option>
    </select>
    <select id="fig-any" onchange="renderG('fig')">
      <option value="2025">2025</option><option value="2026" selected>2026</option>
    </select>
    <button class="preu-pill" onclick="editPreu('fig')" id="fig-preu-btn">0,40 €/dia</button>
  </div>

  <div class="stitle">Lots actius</div>
  <div class="lots-grid" id="fig-lots"></div>
  <div class="btn-row"><button class="btn b-fig b-sm" onclick="openMLot('fig')">+ Nou lot</button></div>

  <div class="stitle">Moviments del mes</div>
  <div class="mov-box">
    <div class="fgrid">
      <div class="fg"><label>Dia</label><input type="number" id="fig-dia" min="1" max="31" placeholder="1–31"></div>
      <div class="fg"><label>Tipus</label>
        <select id="fig-tipus"><option value="sortida">Sortida/Baixa</option><option value="entrada">Entrada</option></select>
      </div>
      <div class="fg"><label>Vedells</label><input type="number" id="fig-qty" min="1" placeholder="Nº"></div>
      <div class="fg"><label>Lot</label><select id="fig-lot" onchange="onLotC('fig')"></select></div>
      <div class="fg"><label>Cartilla</label>
        <select id="fig-cart">
          <option value="ECO">ECO</option>
          <option value="SATF">SATF</option>
          <option value="PE">PE</option>
          <option value="-">—</option>
        </select>
      </div>
      <div class="fg" id="fig-nlg" style="display:none"><label>Nº lot nou</label><input type="number" id="fig-nl" placeholder="ex:11"></div>
    </div>
    <div class="btn-row"><button class="btn b-fig b-sm" onclick="afMov('fig')">+ Afegir</button></div>
    <div class="mov-list" id="fig-movlist"></div>
  </div>

  <div class="stitle">Factures del mes</div>
  <div id="fig-fras"></div>
</div>

<!-- LA COSTA -->
<div class="page" id="page-costa">
  <div class="g-header">
    <div class="g-dot" style="background:var(--costa)"></div>
    <div><h2>Granja La Costa</h2><div class="gsub">Santpedor · Ramaders Comarcals</div></div>
  </div>
  <div class="mes-bar">
    <label>Mes</label>
    <select id="costa-mes" onchange="renderG('costa')">
      <option value="1">Gen</option><option value="2">Feb</option><option value="3" selected>Mar</option>
      <option value="4">Abr</option><option value="5">Mai</option><option value="6">Jun</option>
      <option value="7">Jul</option><option value="8">Ago</option><option value="9">Set</option>
      <option value="10">Oct</option><option value="11">Nov</option><option value="12">Des</option>
    </select>
    <select id="costa-any" onchange="renderG('costa')">
      <option value="2025">2025</option><option value="2026" selected>2026</option>
    </select>
    <button class="preu-pill" onclick="editPreu('costa')" id="costa-preu-btn">0,40 €/dia</button>
  </div>

  <div class="stitle">Lots actius</div>
  <div class="lots-grid" id="costa-lots"></div>
  <div class="btn-row"><button class="btn b-costa b-sm" onclick="openMLot('costa')">+ Nou lot</button></div>

  <div class="stitle">Moviments del mes</div>
  <div class="mov-box">
    <div class="fgrid">
      <div class="fg"><label>Dia</label><input type="number" id="costa-dia" min="1" max="31" placeholder="1–31"></div>
      <div class="fg"><label>Tipus</label>
        <select id="costa-tipus"><option value="sortida">Sortida/Baixa</option><option value="entrada">Entrada</option></select>
      </div>
      <div class="fg"><label>Vedells</label><input type="number" id="costa-qty" min="1" placeholder="Nº"></div>
      <div class="fg"><label>Lot</label><select id="costa-lot" onchange="onLotC('costa')"></select></div>
      <div class="fg" id="costa-nlg" style="display:none"><label>Nº lot nou</label><input type="number" id="costa-nl" placeholder="ex:29"></div>
    </div>
    <div class="btn-row"><button class="btn b-costa b-sm" onclick="afMov('costa')">+ Afegir</button></div>
    <div class="mov-list" id="costa-movlist"></div>
  </div>

  <div class="stitle">Factura del mes</div>
  <div id="costa-fras"></div>
</div>

<!-- MODAL NOU LOT -->
<div class="mbg" id="m-lot">
  <div class="mbox">
    <h3 id="m-lot-title">Nou lot</h3>
    <div class="fgrid" style="grid-template-columns:1fr 1fr">
      <div class="fg" style="grid-column:1/-1"><label>Número de lot</label><input type="number" id="ml-num" placeholder="ex: 11"></div>
      <div class="fg"><label>Vedells inicials</label><input type="number" id="ml-ved" placeholder="0"></div>
      <div class="fg" id="ml-eg"><label>Empresa</label>
        <select id="ml-emp">
          <option value="Ecofutur">Ecofutur</option>
          <option value="Pere Esquerrà">Pere Esquerrà</option>
          <option value="SAT Figuera">SAT Figuera</option>
        </select>
      </div>
    </div>
    <div class="mact">
      <button class="btn b-out" onclick="closeML()">Cancel·lar</button>
      <button class="btn b-ink" onclick="confirML()">Crear</button>
    </div>
  </div>
</div>

<!-- MODAL ASSIGNAR EMPRESA -->
<div class="mbg" id="m-fra">
  <div class="mbox">
    <h3 id="m-fra-title">Assignar empresa</h3>
    <p style="font-size:.8rem;color:var(--muted);margin-bottom:12px">A quina empresa factures aquest lot aquest mes?</p>
    <div id="m-fra-carts" style="margin-bottom:12px;display:flex;gap:5px;flex-wrap:wrap"></div>
    <div class="fg"><label>Empresa facturació</label>
      <select id="m-fra-emp">
        <option value="Ecofutur">Ecofutur</option>
        <option value="Pere Esquerrà">Pere Esquerrà</option>
        <option value="SAT Figuera">SAT Figuera</option>
      </select>
    </div>
    <div class="mact">
      <button class="btn b-out" onclick="closeMF()">Cancel·lar</button>
      <button class="btn b-ink" onclick="confirMF()">Confirmar</button>
    </div>
  </div>
</div>

<script>
const DM=[0,31,28,31,30,31,30,31,31,30,31,30,31];
function dm(m,y){if(m===2&&((y%4===0&&y%100!==0)||(y%400===0)))return 29;return DM[m];}

function defState(){
  return {
    fig:{
      preu:0.40,
      lots:[
        {num:9,v:257,actiu:true,carts:{ECO:203,PE:54},emp:'Ecofutur'},
        {num:10,v:54,actiu:true,carts:{SATF:54},emp:'SAT Figuera'},
      ],
      movs:{}, // "m-y" => [{dia,tipus,qty,lot,cart}]
      assig:{} // "lot-m-y" => empresa
    },
    costa:{
      preu:0.40,
      lots:[
        {num:25,v:3,actiu:true,carts:{RAM:3},emp:'Ramaders'},
        {num:26,v:163,actiu:true,carts:{RAM:163},emp:'Ramaders'},
        {num:27,v:159,actiu:true,carts:{RAM:159},emp:'Ramaders'},
        {num:28,v:149,actiu:true,carts:{RAM:149},emp:'Ramaders'},
      ],
      movs:{},
      assig:{}
    }
  };
}

let S=JSON.parse(localStorage.getItem('vd3')||'null')||defState();
let _mg=null,_mfl=null,_mfg=null;
function sv(){localStorage.setItem('vd3',JSON.stringify(S));}

function showPage(id,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  btn.classList.add('active');
  renderG(id);
}

function ma(g){return{mes:parseInt(document.getElementById(g+'-mes').value),any:parseInt(document.getElementById(g+'-any').value)};}
function mk(m,y){return m+'-'+y;}
function gmovs(g,m,y){return S[g].movs[mk(m,y)]||[];}
function ak(l,m,y){return l+'-'+m+'-'+y;}
function gassig(g,l,m,y){return S[g].assig[ak(l,m,y)]||(S[g].lots.find(x=>x.num===l)||{}).emp||'Ecofutur';}

function ccls(c){
  if(c==='ECO') return 'eco';
  if(c==='PE') return 'pe';
  if(c==='SATF') return 'sat';
  return 'ram';
}
function ecls(e){
  if(e==='Ecofutur') return 'eco';
  if(e==='Pere Esquerrà') return 'pe';
  if(e==='SAT Figuera') return 'sat';
  return 'ram';
}

// ---- RENDER ----
function renderG(g){
  rLots(g); rLotSel(g); rMovList(g); rFras(g);
  document.getElementById(g+'-preu-btn').textContent=S[g].preu.toFixed(2).replace('.',',')+' €/dia';
}

function rLots(g){
  const el=document.getElementById(g+'-lots');
  const lots=S[g].lots.filter(l=>l.actiu);
  if(!lots.length){el.innerHTML='<div class="empty">Cap lot actiu</div>';return;}
  el.innerHTML=lots.map(l=>{
    const ec=ecls(l.emp);
    const cartsHTML=Object.entries(l.carts||{}).map(([c,n])=>
      `<span class="cc cc-${ccls(c)}">${c} ${n}</span>`
    ).join('');
    return `<div class="lot-card bl-${ec}">
      <button class="xbtn" onclick="tancaLot('${g}',${l.num})">✕</button>
      <div class="lc-num">Lot ${l.num}</div>
      <div class="lc-count" style="color:var(--${ec==='eco'?'eco':ec==='pe'?'pe':ec==='sat'?'sat':'costa'})">${l.v}</div>
      <div class="lc-label">vedells</div>
      <div class="lc-carts">${cartsHTML}</div>
    </div>`;
  }).join('');
}

function rLotSel(g){
  const sel=document.getElementById(g+'-lot');
  const prev=sel.value;
  sel.innerHTML=S[g].lots.filter(l=>l.actiu).map(l=>`<option value="${l.num}">Lot ${l.num} (${l.v})</option>`).join('');
  sel.innerHTML+=`<option value="__nou__">+ Lot nou</option>`;
  if(prev) sel.value=prev;
}

function onLotC(g){
  const v=document.getElementById(g+'-lot').value;
  document.getElementById(g+'-nlg').style.display=v==='__nou__'?'block':'none';
  if(v==='__nou__') document.getElementById(g+'-tipus').value='entrada';
}

function rMovList(g){
  const {mes,any}=ma(g);
  const ms=gmovs(g,mes,any).slice().sort((a,b)=>a.dia-b.dia);
  const el=document.getElementById(g+'-movlist');
  if(!ms.length){el.innerHTML='<div class="empty">Cap moviment registrat</div>';return;}
  el.innerHTML=ms.map((m,i)=>{
    const bc=m.tipus==='entrada'?'mb-in':'mb-out';
    const bt=m.tipus==='entrada'?'↑ Entrada':'↓ Sortida';
    const cartBadge=m.cart&&m.cart!=='-'?`<span class="cc cc-${ccls(m.cart)} mc">${m.cart}</span>`:'<span class="mc"></span>';
    return `<div class="mov-item">
      <span class="md">${String(m.dia).padStart(2,'0')}</span>
      <span class="mb ${bc}">${bt}</span>
      <span class="mq">${m.qty}</span>
      <span class="ml">lot ${m.lot}</span>
      ${cartBadge}
      <button class="mdel" onclick="delMov('${g}',${i})">✕</button>
    </div>`;
  }).join('');
}

// ---- TRAMS ----
function calcTrams(g,lotNum,mes,any){
  const lot=S[g].lots.find(l=>l.num===lotNum);
  if(!lot) return [];
  const ms=gmovs(g,mes,any).filter(m=>m.lot===lotNum).sort((a,b)=>a.dia-b.dia);
  const dies=dm(mes,any);
  const preu=S[g].preu;
  let ini=lot.v;
  ms.forEach(m=>{if(m.tipus==='entrada') ini-=m.qty; else ini+=m.qty;});
  let trams=[],actual=ini,dIni=1;
  ms.forEach(ev=>{
    if(ev.dia>dIni&&actual>0){
      const d=ev.dia-dIni;
      trams.push({v:actual,d,imp:Math.round(actual*d*preu*100)/100,lot:lotNum});
      dIni=ev.dia;
    }
    if(ev.tipus==='entrada') actual+=ev.qty; else actual-=ev.qty;
    if(actual<0) actual=0;
  });
  if(dIni<=dies&&actual>0){
    const d=dies-dIni+1;
    trams.push({v:actual,d,imp:Math.round(actual*d*preu*100)/100,lot:lotNum});
  }
  return trams;
}

// ---- FACTURES ----
function rFras(g){
  const {mes,any}=ma(g);
  const preu=S[g].preu;
  const dies=dm(mes,any);
  const perEmp={};

  S[g].lots.filter(l=>l.actiu).forEach(lot=>{
    const emp=gassig(g,lot.num,mes,any);
    if(!perEmp[emp]) perEmp[emp]=[];
    let trams=calcTrams(g,lot.num,mes,any);
    if(!trams.length&&lot.v>0) trams=[{v:lot.v,d:dies,imp:Math.round(lot.v*dies*preu*100)/100,lot:lot.num}];
    perEmp[emp].push(...trams);
  });

  const cont=document.getElementById(g+'-fras');
  if(!Object.keys(perEmp).length){cont.innerHTML='<div class="empty">Cap lot actiu</div>';return;}

  let html='';
  Object.entries(perEmp).forEach(([emp,trams])=>{
    if(!trams.length) return;
    const ec=ecls(emp);
    const base=Math.round(trams.reduce((s,t)=>s+t.imp,0)*100)/100;
    const iva=Math.round(base*.10*100)/100;
    const total=Math.round((base+iva)*100)/100;
    let nFra='';
    if(g==='fig'){
      if(emp==='Ecofutur') nFra=`IC${mes}/${String(any).slice(2)}`;
      else if(emp==='Pere Esquerrà') nFra=`C${mes}/${any}`;
      else nFra=`SAT${mes}/${any}`;
    } else nFra=`${mes}/${any}`;

    const lotNums=[...new Set(trams.map(t=>t.lot))];
    const canviarBtn=g==='fig'?`<button class="btn b-out b-sm" onclick="openMF('${g}',${lotNums[0]})">Canviar empresa</button>`:'';

    html+=`<div class="fra-card fra-${ec}">
      <div class="fra-head">
        <div>
          <h3>${emp}</h3>
          <div class="fra-meta">${nFra} · ${dies}/${mes}/${any}</div>
        </div>
        ${canviarBtn}
      </div>
      <table class="ftable">
        <thead><tr><th>Lot</th><th>Vedells</th><th>Dies</th><th>Preu</th><th class="r">Import</th></tr></thead>
        <tbody>${trams.map(t=>`<tr>
          <td><span class="lchip cc-${ec}">lot ${t.lot}</span></td>
          <td>${t.v}</td><td>${t.d}</td>
          <td>${preu.toFixed(2)} €</td>
          <td class="r">${t.imp.toFixed(2)} €</td>
        </tr>`).join('')}</tbody>
        <tfoot>
          <tr class="fbase"><td colspan="4">Base Imponible</td><td class="r">${base.toFixed(2)} €</td></tr>
          <tr class="fiva"><td colspan="4">IVA 10%</td><td class="r">${iva.toFixed(2)} €</td></tr>
          <tr class="ftot"><td colspan="4">Total</td><td class="r">${total.toFixed(2)} €</td></tr>
        </tfoot>
      </table>
    </div>`;
  });
  cont.innerHTML=html||'<div class="empty">Cap lot actiu</div>';
}

// ---- MOVIMENTS ----
function afMov(g){
  const dia=parseInt(document.getElementById(g+'-dia').value);
  const tipus=document.getElementById(g+'-tipus').value;
  const qty=parseInt(document.getElementById(g+'-qty').value);
  const lotSel=document.getElementById(g+'-lot').value;
  const cart=g==='fig'?document.getElementById('fig-cart').value:'-';
  const {mes,any}=ma(g);
  if(!dia||!qty){alert('Introdueix dia i quantitat');return;}
  let lotNum;
  if(lotSel==='__nou__'){
    const nN=parseInt(document.getElementById(g+'-nl').value);
    if(!nN){alert('Introdueix el número del nou lot');return;}
    S[g].lots.push({num:nN,v:0,actiu:true,carts:{},emp:g==='costa'?'Ramaders':'Ecofutur'});
    lotNum=nN;
  } else lotNum=parseInt(lotSel);
  const k=mk(mes,any);
  if(!S[g].movs[k]) S[g].movs[k]=[];
  S[g].movs[k].push({dia,tipus,qty,lot:lotNum,cart});
  const lot=S[g].lots.find(l=>l.num===lotNum);
  if(lot){if(tipus==='entrada') lot.v+=qty; else{lot.v-=qty;if(lot.v<0)lot.v=0;}}
  sv(); renderG(g);
  document.getElementById(g+'-dia').value='';
  document.getElementById(g+'-qty').value='';
}

function delMov(g,idx){
  const {mes,any}=ma(g);
  const k=mk(mes,any);
  const ms=S[g].movs[k]||[];
  const sorted=ms.slice().sort((a,b)=>a.dia-b.dia);
  const m=sorted[idx];
  const lot=S[g].lots.find(l=>l.num===m.lot);
  if(lot){if(m.tipus==='entrada') lot.v-=m.qty; else lot.v+=m.qty;}
  const oi=S[g].movs[k].findIndex(x=>x.dia===m.dia&&x.qty===m.qty&&x.lot===m.lot&&x.tipus===m.tipus);
  if(oi>=0) S[g].movs[k].splice(oi,1);
  sv(); renderG(g);
}

// ---- LOTS ----
function tancaLot(g,num){
  if(!confirm(`Tancar lot ${num}?`)) return;
  const l=S[g].lots.find(x=>x.num===num);
  if(l){l.actiu=false;l.v=0;}
  sv(); renderG(g);
}

function openMLot(g){
  _mg=g;
  document.getElementById('m-lot-title').textContent='Nou lot — '+(g==='fig'?'Figuera':'La Costa');
  document.getElementById('ml-eg').style.display=g==='costa'?'none':'block';
  document.getElementById('ml-num').value='';
  document.getElementById('ml-ved').value='';
  document.getElementById('m-lot').classList.add('open');
}
function closeML(){document.getElementById('m-lot').classList.remove('open');}
function confirML(){
  const num=parseInt(document.getElementById('ml-num').value);
  const v=parseInt(document.getElementById('ml-ved').value)||0;
  const emp=_mg==='costa'?'Ramaders':document.getElementById('ml-emp').value;
  if(!num){alert('Introdueix el número');return;}
  if(S[_mg].lots.find(l=>l.num===num&&l.actiu)){alert('Lot ja existent');return;}
  S[_mg].lots.push({num,v,actiu:true,carts:{},emp});
  sv(); renderG(_mg); closeML();
}

// ---- ASSIGNAR EMPRESA ----
function openMF(g,lotNum){
  _mfg=g; _mfl=lotNum;
  const {mes,any}=ma(g);
  const lot=S[g].lots.find(l=>l.num===lotNum);
  document.getElementById('m-fra-title').textContent=`Lot ${lotNum} — empresa facturació`;
  const cartsEl=document.getElementById('m-fra-carts');
  cartsEl.innerHTML=Object.entries(lot.carts||{}).map(([c,n])=>
    `<span class="cc cc-${ccls(c)}">${c} ${n}</span>`
  ).join('');
  document.getElementById('m-fra-emp').value=gassig(g,lotNum,mes,any);
  document.getElementById('m-fra').classList.add('open');
}
function closeMF(){document.getElementById('m-fra').classList.remove('open');}
function confirMF(){
  const {mes,any}=ma(_mfg);
  S[_mfg].assig[ak(_mfl,mes,any)]=document.getElementById('m-fra-emp').value;
  sv(); renderG(_mfg); closeMF();
}

function editPreu(g){
  const n=parseFloat(prompt('Nou preu €/dia:',S[g].preu));
  if(!isNaN(n)&&n>0){S[g].preu=n;sv();renderG(g);}
}

document.getElementById('avui').textContent=new Date().toLocaleDateString('ca-ES',{day:'numeric',month:'short',year:'numeric'});
renderG('fig');renderG('costa');
</script>
